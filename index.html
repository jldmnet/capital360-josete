'use strict';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],banks=[],groups=['Sin asignar'],hidden=false,page='Inicio',filter='',typeFilter='',groupFilter='';const types=['Cuenta corriente','Cuenta de ahorro','Efectivo','Fondo','ETF','Acción','Cartera de valores','Plan de pensiones'];function add(bank,type,names){names.forEach(name=>products.push({id:products.length+1,bank,type,name,group:'Sin asignar',history:[],archived:false}))}const pages=['Inicio','Entidades','Inversiones','Liquidez','Jubilación','Evolución','Movimientos','Actualizar saldos','Configuración'];const liquid=p=>['Cuenta corriente','Cuenta de ahorro','Efectivo'].includes(p.type);const pension=p=>p.type==='Plan de pensiones';const active=()=>products.filter(p=>!p.archived);const latest=(p,date='9999-12-31')=>p.history.filter(h=>h.date<=date).sort((a,b)=>b.date.localeCompare(a.date))[0];const money=v=>hidden?'••••':v==null?'—':v.toLocaleString('es-ES',{style:'currency',currency:'EUR'});const sum=(ps,date)=>{let a=ps.map(p=>latest(p,date)?.value).filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0):null};const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let valuationDate=today();let period='all';function go(p){page=p;filter=typeFilter=groupFilter='';render()}function render(){ $('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('');$('title').textContent=page;$('privacy').textContent=hidden?'Mostrar importes':'Ocultar importes';$('theme').textContent=document.body.classList.contains('dark')?'Modo claro':'Modo oscuro';let a=active(),v=$('view');if(page==='Inicio'){let metrics=[['Capital registrado',a],['Liquidez',a.filter(liquid)],['Inver imary" id="new">+ Nuevo producto</button></div><div id="editor"></div><div class="card scroll"><table><tr><th>Entidad</th><th>Producto</th><th>Tipo</th><th>Grupo</th><th>Saldo</th><th>Estado</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.bank)}</td><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(p.group)}</td><td>${money(latest(p)?.value)}</td><td>${p.archived?'Archivado':'Activo'}</td><td><button data-edit="${p.id}">Editar</button> <button data-archive="${p.id}">${p.archived?'Reactivar':'Archivar'}</button></td></tr>`).join('')}</table></div>`}}function chart(){let dates=[...new Set(products.flatMap(p=>p.history.map(h=>h.date)))].sort();if(!dates.length||hidden)return '<p class="muted">'+(hidden?'Importes ocultos':'Sin valoraciones registradas. El gráfico aparecerá al añadir valoraciones.')+'</p>';if(page==='Evolución'&&period!=='all'){let buckets=new Map();dates.forEach(d=>{let k=period==='year'?d.slice(0,4):period==='month'?d.slice(0,7):d.slice(0,4)+'Q'+Math.ceil(Number(d.slice(5,7))/3);buckets.set(k,d)});dates=[...buckets.values()]}let vals=dates.map(d=>sum(active(),d)??0),lo=Math.min(0,...vals),hi=Math.max(1,...vals),pts=vals.map((n,i)=>`${20+i*460/Math.max(1,vals.length-1)},${155-(n-lo)*135/(hi-lo)}`).join(' ');return `<svg viewBox="0 0 500 180" role="img" aria-label="Evolución del capital"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3"/>${pts.split(' ').map(p=>{let [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`}).join('')}</svg><div class="row"><span>${dates[0]}</span><strong>${money(vals.at(-1))}</strong><span>${dates.at(-1)}</span></div><div class="scroll"><table><tr><th>Fecha de valoración</th><th>Capital registrado</th><th>Cobertura</th></tr>${dates.map((d,i)=>`<tr><td>${d}</td><td>${money(vals[i])}</td><td>${active().filter(p=>latest(p,d)).length} / ${active().length}</td></tr>`).join('')}</table></div>`}function edit(p){$('editor').innerHTML=`<div class="card"><h2>${p?'Editar':'Nuevo'} producto</h2><form id="productform" data-id="${p?.id??''}"><div class="grid"><label>Nombre<input name="name" required value="${esc(p?.name)}"></label><label>Entidad<select name="bank">${opts(banks,p?.bank)}</select></label><label>Tipo<select name="type">${opts(types,p?.type)}</select></label><label>Grupo<select name="group">${opts(groups,p?.group)}</select></label></div><details><summary>Campos avanzados</summary><div class="grid">${['ISIN','Ticker','Referencia','Fecha de contratación','Mercado','Sector','Riesgo','Observaciones'].map(k=>`<label>${k}<input name="${k}" value="${esc(p?.[k])}"></label>`).join('')}</div></details><button class="primary">Guardar producto</button><button type="button" id="cancel">Cancelar</button></form></div>`}document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.page)go(t.dataset.page);else if(t.id==='privacy'){hidden=!hidden;render()}else if(t.id==='theme'){document.body.classList.toggle('dark');render()}else if(t.id==='new')edit();else if(t.dataset.edit)edit(products.find(p=>p.id==t.dataset.edit));else if(t.dataset.archive){let p=products.find(p=>p.id==t.dataset.archive);p.archived=!p.archived;render()}else if(t.id==='cancel')$('editor').innerHTML='';else if(t.id==='save'){let d=$('date').value;if(!d||d>today())return alert('Selecciona una fecha válida, no futura');let inputs=[...document.querySelectorAll('[data-value]')].filter(i=>i.value!=='');if(inputs.some(i=>!i.checkValidity()||!Number.isFinite(Number(i.value))))return alert('Revisa los importes');if(inputs.some(i=>products.find(p=>p.id==i.dataset.value).history.some(h=>h.date===d&&h.value!==Number(i.value)))&&!confirm('¿Modificar las valoraciones existentes de esta fecha?'))return;inputs.forEach(i=>{let p=products.find(p=>p.id==i.dataset.value);p.history=p.history.filter(h=>h.date!==d);p.history.push({date:d,value:Number(i.value)})});alert(`${inputs.length} valoraciones registradas; comprobando guardado`);render()}});document.ad function analysisView(){

async function openVault(raw,p){let o=JSON.parse(raw);if(o.version!==1)throw Error('Formato incompatible');let sa=un64(o.salt),iv=un64(o.iv);if(sa.length!==16||iv.length!==12)throw Error('Formato inválido');let k=await derive(p,sa),d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,un64(o.data))));if(!Array.isArray(d.products)||!Array.isArray(d.banks)||!Array.isArray(d.groups)||!d.products.every(p=>Number.isSafeInteger(p.id)&&Array.isArray(p.history)&&p.history.every(h=>/^\d{4}-\d{2}-\d{2}$/.test(h.date)&&Number.isFinite(h.value))))throw Error('Datos inválidos');return {k,sa,d}}

function persist(){markDirty();if(!key)return;let data=state(),k=key,sa=salt;pending++;queue=queue.then(async()=>{try{localStorage.setItem(storageKey,await seal(data,k,sa));failed=false;$('status').textContent='Guardado local cifrado · '+new Date().toLocaleTimeString('es-ES')}catch(e){failed=true;$('status').textContent='ERROR: cambios no guardados. Descarga una copia cifrada.'}finally{pending--}});return queue}
